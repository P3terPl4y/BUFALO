name: Production candidate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: peter
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: bufalo_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      APP_ENV: testing
      APP_KEY: 0123456789abcdef0123456789abcdef
      APP_URL: http://localhost
      DB_CONNECTION: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: bufalo_ci_test
      DB_USERNAME: peter
      DB_PASSWORD: isolated-test-only
      DB_DSN: ''
      MAIL_HOST: ''
      MAIL_PORT: '0'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - name: Format
        run: test -z "$(gofmt -l app bootstrap config database routes tests main.go)"
      - name: Static analysis
        run: go vet -p 1 ./...
      - name: Create isolated test databases
        run: |
          for database in \
            bufalo_services_test bufalo_controllers_test bufalo_feature_test \
            bufalo_redteam_test bufalo_unit_test bufalo_race_services_test \
            bufalo_race_controllers_test; do
            PGPASSWORD="$DB_PASSWORD" createdb --host "$DB_HOST" --port "$DB_PORT" --username "$DB_USERNAME" "$database"
          done
      - name: Ensure isolated Redis test executable
        run: |
          if ! command -v redis-server >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y redis-server
          fi
          redis-server --version
      - name: Acceptance — unit and infrastructure packages
        run: go test -v -p 1 -count=1 . ./app/billing ./app/community ./app/dbresilience ./app/exports ./app/http/ingress ./app/maildelivery ./app/models ./app/monitoring ./app/requests ./app/viewhelpers ./routes ./tests
      - name: Acceptance — middleware Redis integration
        run: go test -v -p 1 -count=1 ./app/http/middleware
      - name: Acceptance — session store Redis integration
        run: go test -v -p 1 -count=1 ./app/sessionstore
      - name: Acceptance — services
        env:
          DB_DATABASE: bufalo_services_test
        run: go test -v -p 1 -count=1 ./app/services
      - name: Acceptance — controllers
        env:
          DB_DATABASE: bufalo_controllers_test
        run: go test -v -p 1 -count=1 ./app/http/controllers
      - name: Acceptance — feature journeys
        env:
          DB_DATABASE: bufalo_feature_test
        run: go test -v -p 1 -count=1 ./tests/feature
      - name: Acceptance — redteam
        env:
          DB_DATABASE: bufalo_redteam_test
        run: go test -v -p 1 -count=1 ./tests/redteam
      - name: Acceptance — unit services
        env:
          DB_DATABASE: bufalo_unit_test
        run: |
          set +e
          go test -v -p 1 -count=1 ./tests/unit > /tmp/bufalo-unit-tests.log 2>&1
          result=$?
          cat /tmp/bufalo-unit-tests.log
          if [ "$result" -ne 0 ]; then
            details="$(tail -n 12 /tmp/bufalo-unit-tests.log | tr '\n' ' ')"
            details="${details//'%'/'%25'}"
            details="${details//'\r'/'%0D'}"
            details="${details//';'/'%3B'}"
            details="${details//','/'%2C'}"
            echo "::error title=Unit service tests failed::$details"
          fi
          exit "$result"
      - name: Race detection — services
        env:
          DB_DATABASE: bufalo_race_services_test
        run: go test -race -p 1 -count=1 ./app/services
      - name: Race detection — controllers
        env:
          DB_DATABASE: bufalo_race_controllers_test
        run: go test -race -p 1 -count=1 ./app/http/controllers
      - name: Optimized binary
        run: CGO_ENABLED=0 go build -p 1 -trimpath -ldflags='-s -w' -o storage/release/bufalo .
      - name: Dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          ! go list -deps ./... | grep -E '^golang.org/x/crypto/openpgp($|/)'
          sudo systemd-run --scope -p MemoryMax=2G -p MemorySwapMax=0 -p CPUQuota=100% env GOMEMLIMIT=512MiB GOMAXPROCS=2 GOFLAGS=-p=1 timeout 15m "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Container build
        run: docker build -t bufalo:candidate .
